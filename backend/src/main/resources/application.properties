server.port=8080
spring.application.name=indian-stock-analyzer

# CORS settings (only needed when running frontend separately via npm start)
cors.allowed.origins=http://localhost:3000

# ── External data source configuration ───────────────────────────────────────
#
# Yahoo Finance (unofficial JSON API – no key required)
# Endpoint: https://query1.finance.yahoo.com/
# Rate limit: ~2,000 requests / hour per IP
# NSE suffix: .NS (e.g. RELIANCE.NS)
#
data.yahoo.base-chart=https://query1.finance.yahoo.com/v8/finance/chart/
data.yahoo.base-summary=https://query1.finance.yahoo.com/v10/finance/quoteSummary/
data.yahoo.connect-timeout-seconds=8
data.yahoo.read-timeout-seconds=15

# News RSS feeds (all public, no API key)
data.news.google-rss-template=https://news.google.com/rss/search?q=%s+NSE+stock+India&hl=en-IN&gl=IN&ceid=IN:en
data.news.et-markets-rss=https://economictimes.indiatimes.com/markets/stocks/rss.cms
data.news.moneycontrol-rss=https://www.moneycontrol.com/rss/latestnews.xml
data.news.business-standard-rss=https://www.business-standard.com/rss/markets-106.rss
data.news.max-articles-per-stock=25

# Cache TTLs (minutes)
cache.quote.ttl-minutes=5
cache.fundamental.ttl-hours=6
cache.analyst.ttl-hours=12
cache.news.ttl-minutes=15
cache.historical.ttl-hours=1
cache.earnings.ttl-hours=6

# Logging
logging.level.com.stockanalyzer=DEBUG
logging.level.com.stockanalyzer.client=INFO
logging.level.com.stockanalyzer.inference=INFO
